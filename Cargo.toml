[package]
name = "winkeylock"
version = "0.2.6"
edition = "2024"
authors = ["Kevin Darlington <kevin@outroot.com>"]
readme = "README.md"
repository = "https://github.com/kdar/winkeylock"
homepage = "https://github.com/kdar/winkeylock"
description = """
Automatically enable/disable the windows key when you're in a game or any app that is too busy for notifications.
"""
keywords = ["windows", "winkey"]
build = "build.rs"
exclude = ["/dev/*"]

[dependencies]
dirs = "7.0.0"
elevated-command = "1.1.3"
iced = { version = "0.14", default-features = false, features = [
  "wgpu",
  "thread-pool",
] }
notify = { version = "8.2", default-features = false }
once_cell = { version = "1.21.4", default-features = false }
opener = "0.8.5"
serde = { version = "1.0.229", default-features = false }
serde_json = "1.0.151"
tao = { version = "0.37.0", default-features = false }
tray-icon = { version = "0.24.2", default-features = false }
windows-strings = { version = "0.5.1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[build-dependencies]
winresource = { version = "0.1.31", default-features = false }

[dependencies.windows]
version = "0.62.2"
features = [
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
]

[features]

[package.metadata.winresource]
OriginalFilename = "winkeylock.exe"
LegalCopyright = "Copyright 2022 Kevin Darlington. MIT licensed."
FileDescription = "Winkey Lock"
ProductName = "Winkey Lock"

[profile.release-fast]
inherits = "release"
lto = true
codegen-units = 1
